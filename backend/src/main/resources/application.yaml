spring:
  application:
    name: puang
  config:
    import: optional:file:.env[.properties]

  # If DB_URL is set (e.g. in .env), MySQL is used.
  # If it is not set, the app falls back to an in-memory H2 database in MySQL mode.
  # The driver and Hibernate dialect are detected from the URL.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:puang;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

# JWT settings. Put JWT_SECRET in .env (at least 32 characters).
# If JWT_SECRET is empty, a random key is generated at startup (dev only: tokens break on restart).
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT1H}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P14D}
