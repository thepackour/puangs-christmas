# Test server for the frontend. Copied to the server by the deploy workflow.
# Secrets live in .env next to this file on the server (see deploy/.env.example).
services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thepackour/puangs-christmas-backend:latest}
    container_name: puang-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8082:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
